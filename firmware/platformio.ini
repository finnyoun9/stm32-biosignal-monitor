; STM32F103C8T6（蓝板）+ MAX30102 采集固件
; 与 stm32-smart-home-ota 保持同一套工具链与上传方式，方便复用已有的下载脚本。
;
; 注意：本工程只包含**应用层**（驱动、任务、协议）。HAL 初始化层由 STM32CubeMX 生成，
; 生成步骤见 firmware/README.md。这样做的原因：CubeMX 生成的 Core/ 目录与芯片型号、
; 时钟树、引脚复用强绑定，手写反而容易错；仓库里保留的是可审查、可测试的部分。

[platformio]
default_envs = bluepill

[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

build_flags =
    -I firmware/include
    -I firmware/app
    -I firmware/Core/Inc
    -I firmware/lib/FreeRTOS/include
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DSTM32F103xB
    -DUSE_HAL_DRIVER

; 只编译应用层 + CubeMX 生成的 Core；排除主机端测试
build_src_filter =
    +<../firmware/app/>
    +<../firmware/src/>
    +<../firmware/Core/Src/>
    +<../firmware/lib/FreeRTOS/src/>
    -<../tests/>

board_build.ldscript = firmware/STM32F103C8TX.ld
