; STM32F103C8T6（蓝板）+ MAX30102 采集固件
;
; 与前身项目 stm32-smart-home-ota 保持同一套工具链与工程约定（framework=stm32cube、ST-Link 上传、
; FreeRTOS 内核 V10.3.1 直接内置在 lib/ 下），这样已有的下载与调试经验可以直接沿用。
;
; 与旧版的差别：**不再需要 STM32CubeMX 生成 Core/**。HAL 初始化（时钟、GPIO、I2C1、USART1、TIM2）
; 全部写在 firmware/src/board.c 与 firmware/app/{env_i2c,uart_link}.c 里，HAL 配置头用 PlatformIO
; stm32cube 框架自带的默认版本。目的：让「能不能编译」成为仓库里可复现的一件事（`pio run`），
; 而不是依赖本机某个 CubeMX 工程。

[platformio]
; 与前身项目一致：src_dir 设为工程根，build_src_filter 里的路径就相对 firmware/ 解析
src_dir = .
default_envs = bluepill

[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

build_flags =
    -I include
    -I app
    -I src
    -I .
    -I lib/FreeRTOS/include
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DSTM32F103xB
    -DUSE_HAL_DRIVER

; 路径相对 src_dir（= firmware/）；主机端测试在仓库根的 tests/，本来就不在这个 src_dir 下。
; FreeRTOS 不列在这里——lib/FreeRTOS/{include,src} 会被 PlatformIO 的库机制自动识别并只编译一次
; （之前同时列进来会导致内核被编译两遍）。
build_src_filter =
    +<app/>
    +<src/>
