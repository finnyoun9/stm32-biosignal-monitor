name: P0 verification

# P0（无需硬件）的全部验证：算法单测、C/Python 协议一致性、驱动主机端单测。
# 有 CI 的意义：这些证据是「可复现」的——别人 clone 下来就能跑出同样的结果。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Algorithm unit tests (synthetic signals with known ground truth)
        run: python tests/test_algorithms.py

      - name: Protocol conformance (C vs Python byte-level)
        run: python tests/test_protocol_conformance.py

      - name: MAX30102 driver host tests (simulated I2C chip)
        run: python tests/test_driver_host.py

      - name: PPG algorithm conformance (C firmware vs Python, synthetic signals)
        run: python tests/test_algo_conformance.py

      - name: Power budget conformance (C firmware vs Python)
        run: python tests/test_power_budget.py

      - name: ECG QRS conformance (C firmware vs Python)
        run: python tests/test_ecg_conformance.py

      - name: Dual-channel capture selftest (no hardware)
        run: python tools/serial_capture.py --selftest --out /tmp/ppg.csv --out-ecg /tmp/ecg.csv

      - name: Dual-channel acceptance logic (synthetic + negative control)
        run: python tests/test_dual_channel_acceptance.py

      - name: Capture report selftest (good vs bad data)
        run: python tests/test_inspect_capture.py

      - name: Mains notch verification (depth, passband, support range)
        run: python tests/test_notch.py

      - name: Mains notch benefit on ECG (strong interference)
        run: python tests/test_notch_ecg.py
